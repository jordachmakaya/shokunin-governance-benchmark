name: CI

on:
  push:
    branches: [main, codex/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: pnpm install --frozen-lockfile
      # Live Harbor round-trips require a privileged Docker/Podman daemon and
      # are executed by the benchmark pilot environment, not a standard runner.
      - run: pnpm foundation:check
      - run: pnpm hooks:test
      - run: pnpm typecheck
      - run: pnpm test:core
      - run: pnpm test:evals
      - run: pnpm test:cli
